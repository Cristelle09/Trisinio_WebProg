  background-color: rgb(255, 30, 165);
  padding: 5px;
}
.container div {
  background-color: white;
  padding: 10px;
}
.container div.header {
  grid-area: header;
  text-align: center;
}
.container div.menu {
  grid-area: menu;
}
.container div.content{
  grid-area: content;
}
.container div.content1 {
  grid-area: content1;
}
.container div.footer {
  grid-area: footer;
  text-align: center;  
}
</style>
</head>
